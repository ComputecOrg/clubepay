name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clubepay
          POSTGRES_PASSWORD: clubepay
          POSTGRES_DB: clubepay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://clubepay:clubepay@localhost:5432/clubepay_test?sslmode=disable
          JWT_SECRET: ci-test-secret
          CRON_SECRET: ci-cron-secret
        run: go test ./... -v -race -count=1

      - name: Build
        working-directory: backend
        run: go build -o /dev/null ./cmd/api

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npx vitest run

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build

  docker-build:
    name: Docker Build Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t clubepay-api:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t clubepay-web:ci .

  push-images:
    name: Build & Push Docker Images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/clubepay-api
          docker build -f Dockerfile.backend -t "$IMAGE:latest" -t "$IMAGE:${{ steps.vars.outputs.sha_short }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ steps.vars.outputs.sha_short }}"

      - name: Build and push frontend image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/clubepay-web
          docker build -f Dockerfile.frontend -t "$IMAGE:latest" -t "$IMAGE:${{ steps.vars.outputs.sha_short }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ steps.vars.outputs.sha_short }}"

  deploy:
    name: Deploy via Coolify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [push-images]

    steps:
      - name: Trigger Coolify webhook
        run: |
          curl -fsSL -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}"
